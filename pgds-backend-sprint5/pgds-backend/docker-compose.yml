
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
      MYSQL_DATABASE: pgds
      MYSQL_USER: ${DB_USER:-pgds_app}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in your environment}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/pgds?useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER:-pgds_app}
      DB_PASS: ${DB_PASS:?Set DB_PASS in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
    ports:
      - "8080:8080"

volumes:
  mysql_data: